<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eSevaCenter Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
      padding: 0;
    }

    .container {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #0066cc, #00a8e8);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      margin-right: 10px;
      font-size: 18px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #0066cc;
    }

    .status {
      padding: 12px;
      background: white;
      border-radius: 6px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
    }

    .status-label {
      font-size: 12px;
      color: #666;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .status-value {
      font-size: 14px;
      font-weight: 600;
      color: #0066cc;
    }

    .status-value.active {
      color: #51cf66;
    }

    .status-value.inactive {
      color: #999;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #0066cc;
      color: white;
    }

    .btn-primary:hover {
      background: #0052a3;
    }

    .btn-secondary {
      background: white;
      color: #0066cc;
      border: 2px solid #0066cc;
    }

    .btn-secondary:hover {
      background: #f0f4ff;
    }

    .btn-danger {
      background: #ff6b6b;
      color: white;
    }

    .btn-danger:hover {
      background: #ff5252;
    }

    .message {
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .message.success {
      background: #d3f9d8;
      color: #2f9e44;
      border: 1px solid #51cf66;
    }

    .message.error {
      background: #ffe0e0;
      color: #c92a2a;
      border: 1px solid #ff6b6b;
    }

    .message.info {
      background: #d0ebff;
      color: #0066cc;
      border: 1px solid #74c0fc;
    }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      color: #999;
      text-align: center;
    }

    .operation-details {
      background: white;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
      font-size: 12px;
    }

    .operation-details div {
      margin-bottom: 6px;
    }

    .operation-details label {
      color: #666;
      font-weight: 500;
      display: inline-block;
      width: 120px;
    }

    .operation-details strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">e</div>
      <h1>eSevaCenter Assistant</h1>
    </div>

    <div id="message-container"></div>

    <div id="status-section"></div>

    <div id="operation-section" style="display: none;">
      <div class="operation-details">
        <div>
          <label>Operation ID:</label>
          <strong id="op-id"></strong>
        </div>
        <div>
          <label>Service:</label>
          <strong id="op-service"></strong>
        </div>
        <div>
          <label>Status:</label>
          <strong id="op-status"></strong>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="btn-fetch-operation" class="btn-primary">Load Active Operation</button>
      <button id="btn-refill-form" class="btn-secondary" style="display: none;">Refill Form</button>
    </div>

    <div class="footer">
      <p>Connected to localhost:8765</p>
      <p>v1.0.0 - Tamil Nadu e-Services</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
